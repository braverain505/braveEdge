<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f2039" />

    <title>BraveEdge Technologies — Automation Agency</title>
    <meta
      name="description"
      content="BraveEdge Technologies designs, builds and runs the automation systems that remove manual work from your operations — workflow automation, AI assistants, integrations and internal tools."
    />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BraveEdge Technologies — Automation Agency" />
    <meta
      property="og:description"
      content="We design, build and run the automation systems that remove manual work from your operations."
    />
    <meta property="og:site_name" content="BraveEdge Technologies" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Update these once the production domain is live — or set VITE_SITE_URL in
      .env and the build will rewrite them automatically.
    -->
    <link rel="canonical" href="https://braveedge.tech/" />
    <meta property="og:url" content="https://braveedge.tech/" />

    <!--
      Fonts are self-hosted via @fontsource (imported in src/main.jsx), so the
      page makes no third-party requests. No Google Fonts link required.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
